<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Simple in-memory to-do list: add, complete and remove tasks.">
  <title>To-Do List | Mantu Yadav</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <header class="card-header">
      <div>
        <p class="eyebrow">Veda Technology &middot; Task 16</p>
        <h1>My To-Do List</h1>
      </div>
      <p id="count" class="count" aria-live="polite"></p>
    </header>

    <form id="task-form" class="task-form" novalidate>
      <label for="task-input" class="sr-only">New task</label>
      <input id="task-input" type="text" maxlength="100" placeholder="What needs to be done?" autocomplete="off" aria-describedby="form-error">
      <button type="submit" class="btn add">Add task</button>
    </form>
    <p id="form-error" class="form-error" role="alert"></p>

    <ul id="task-list" class="task-list" aria-label="Tasks"></ul>

    <p id="empty" class="empty">No tasks yet. Add your first task above.</p>

    <footer class="card-footer">
      <p class="note">Tasks are kept in memory only, so they disappear when the page is refreshed.</p>
      <button id="clear-done" class="btn ghost" type="button" disabled>Clear completed</button>
    </footer>
  </main>

  <footer class="foot"><p>Built by Mantu Yadav &middot; Veda Technology Internship</p></footer>

  <p id="status" class="sr-only" role="status" aria-live="polite"></p>

  <script src="script.js"></script>
</body>
</html>
