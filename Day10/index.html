<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="Responsive image gallery with a lightbox preview, built with HTML, CSS Grid and JavaScript.">
  <title>Image Gallery | Mantu Yadav</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header class="page-header">
    <div class="container">
      <p class="eyebrow">Veda Technology &middot; Task 9</p>
      <h1>Image Gallery</h1>
      <p class="intro">Nine landscapes in a responsive grid. Select any image to open a larger preview.</p>
    </div>
  </header>

  <main class="container">
    <section aria-label="Image gallery">
      <ul class="gallery" role="list">
        <li>
          <button class="thumb" type="button" data-title="Mountain Sunrise"
            aria-label="View larger image: Mountain Sunrise">
            <img
              src="https://img.magnific.com/free-vector/elegant-beautiful-sunset-evening-scene-background_1055-17736.jpg?semt=ais_hybrid&w=740&q=80"
              alt="Layered purple mountains under a glowing orange sunrise sky" width="1200" height="800"
              loading="lazy">
            <span class="thumb-cap">Mountain Sunrise</span>
          </button>
        </li>
        <li>
          <button class="thumb" type="button" data-title="Ocean Sunset" aria-label="View larger image: Ocean Sunset">
            <img
              src="https://images.pexels.com/photos/34752112/pexels-photo-34752112/free-photo-of-serene-ocean-sunset-with-reflective-waves.jpeg?cs=tinysrgb&dpr=1&w=500"
              alt="Large sun setting over a calm blue ocean with light reflections" width="1200" height="800"
              loading="lazy">
            <span class="thumb-cap">Ocean Sunset</span>
          </button>
        </li>
        <li>
          <button class="thumb" type="button" data-title="Pine Forest" aria-label="View larger image: Pine Forest">
            <img
              src="https://images.pexels.com/photos/37576022/pexels-photo-37576022/free-photo-of-serene-boreal-forest-pathway-at-dusk.png?cs=tinysrgb&dpr=1&w=500"
              alt="Rows of dark green pine trees in a misty forest" width="1200" height="800" loading="lazy">
            <span class="thumb-cap">Pine Forest</span>
          </button>
        </li>
        <li>
          <button class="thumb" type="button" data-title="Desert Dunes" aria-label="View larger image: Desert Dunes">
            <img
              src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQm_UAD8jVpGE8ZIBW0AQPl2prhH9YPf2Awzan5wzlzaVsGz5iXa4ryEy8N&s=10"
              alt="Golden sand dunes beneath a pale sun and clear sky" width="1200" height="800" loading="lazy">
            <span class="thumb-cap">Desert Dunes</span>
          </button>
        </li>
        <li>
          <button class="thumb" type="button" data-title="Northern Lights"
            aria-label="View larger image: Northern Lights">
            <img
              src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQeV6mvXArwMUnl1vtb-hzntHANw-dbfzwMExyrQ9MMKA&s=10"
              alt="Green and violet aurora over snowy hills and pine trees" width="1200" height="800" loading="lazy">
            <span class="thumb-cap">Northern Lights</span>
          </button>
        </li>
        <li>
          <button class="thumb" type="button" data-title="City at Night" aria-label="View larger image: City at Night">
            <img src="https://static.toiimg.com/thumb/60208969.cms?resizemode=75&width=1200&height=900"
              alt="City skyline with lit windows under a bright moon" width="1200" height="800" loading="lazy">
            <span class="thumb-cap">City at Night</span>
          </button>
        </li>
        <li>
          <button class="thumb" type="button" data-title="Calm Lake" aria-label="View larger image: Calm Lake">
            <img
              src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQOdxtDMOWsmjlh4k-tqGnq_N1K8-oT16iBTMwKv4mJYw&s=10"
              alt="Mountains reflected in a still blue lake under soft clouds" width="1200" height="800" loading="lazy">
            <span class="thumb-cap">Calm Lake</span>
          </button>
        </li>
        <li>
          <button class="thumb" type="button" data-title="Starry Hills" aria-label="View larger image: Starry Hills">
            <img
              src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQkRFD00a7BtnrwxiR2Ol9hEUA46CRxqws5l8xcWIyd8g&s=10"
              alt="Rolling dark hills under a night sky full of stars and a moon" width="1200" height="800"
              loading="lazy">
            <span class="thumb-cap">Starry Hills</span>
          </button>
        </li>
        <li>
          <button class="thumb" type="button" data-title="Autumn Valley" aria-label="View larger image: Autumn Valley">
            <img
              src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS2XxmQiQS_2RtIxayoBgdyqMm3Nct419a9x_rzzYLurA&s=10"
              alt="Orange and red autumn hills with scattered white clouds" width="1200" height="800" loading="lazy">
            <span class="thumb-cap">Autumn Valley</span>
          </button>
        </li>
      </ul>
    </section>
  </main>

  <footer class="foot">
    <p>Built by Mantu Yadav &middot; Veda Technology Internship</p>
  </footer>

  <!-- Lightbox: hidden until an image is selected -->
  <dialog id="lightbox" class="lightbox" aria-label="Image preview">
    <div class="stage">
      <button id="lb-close" class="lb-btn close" type="button" aria-label="Close preview">&times;</button>
      <button id="lb-prev" class="lb-btn nav prev" type="button" aria-label="Previous image">&#8249;</button>
      <figure class="lb-figure">
        <img id="lb-img" class="lb-img" src="" alt="">
        <figcaption class="lb-caption"><span id="lb-title"></span><span id="lb-count" class="lb-count"></span>
        </figcaption>
      </figure>
      <button id="lb-next" class="lb-btn nav next" type="button" aria-label="Next image">&#8250;</button>
    </div>
  </dialog>

  <script src="script.js"></script>
</body>

</html>
