<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A responsive live digital clock built with HTML, CSS and JavaScript.">
  <title>Digital Clock | Mantu Yadav</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="clock-card">
    <p class="eyebrow">Live Digital Clock</p>

    <div class="clock" role="timer" aria-label="Current time">
      <span id="hours" class="digit">00</span>
      <span class="colon" aria-hidden="true">:</span>
      <span id="minutes" class="digit">00</span>
      <span class="colon" aria-hidden="true">:</span>
      <span id="seconds" class="digit">00</span>
      <span id="period" class="period" hidden>AM</span>
    </div>

    <p id="date" class="date">Loading date…</p>

    <button id="format-toggle" class="toggle" type="button" aria-pressed="false">Switch to 12-hour format</button>
  </main>

  <footer class="foot">
    <p>Built by Mantu Yadav &middot; Veda Technology Internship, Task 4</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
