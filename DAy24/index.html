<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Rock Paper Scissors against the computer with a running score.">
  <title>Rock Paper Scissors | Mantu Yadav</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@600;700&display=swap"
    rel="stylesheet">
  <link rel="style" href="style.css">
</head>

<body>
  <main class="card">
    <header>
      <p class="eyebrow">Veda Technology &middot; Task 24</p>
      <h1>Rock Paper Scissors</h1>
      <p class="intro">Beat the computer. Pick a move with the buttons or press <kbd>R</kbd>, <kbd>P</kbd> or
        <kbd>S</kbd>.</p>
    </header>

    <section class="scoreboard" aria-label="Score">
      <div class="score you"><span class="label">You</span><span class="num" id="score-player">0</span></div>
      <div class="score draw"><span class="label">Draws</span><span class="num" id="score-draws">0</span></div>
      <div class="score cpu"><span class="label">Computer</span><span class="num" id="score-computer">0</span></div>
    </section>

    <section class="arena" aria-label="Current round">
      <div class="hand-box"><span class="who">You</span><span class="hand" id="hand-player"
          aria-hidden="true">&#10067;</span></div>
      <span class="vs" aria-hidden="true">VS</span>
      <div class="hand-box"><span class="who">Computer</span><span class="hand" id="hand-computer"
          aria-hidden="true">&#10067;</span></div>
    </section>

    <p class="banner" id="banner" role="status" aria-live="polite">Make your move!</p>
    <p class="detail" id="detail">Round 1</p>

    <div class="choices" id="choices">
      <button class="choice" type="button" data-choice="rock" aria-label="Rock (press R)"><span class="emoji"
          aria-hidden="true">&#9994;</span>Rock <kbd>R</kbd></button>
      <button class="choice" type="button" data-choice="paper" aria-label="Paper (press P)"><span class="emoji"
          aria-hidden="true">&#9995;</span>Paper <kbd>P</kbd></button>
      <button class="choice" type="button" data-choice="scissors" aria-label="Scissors (press S)"><span class="emoji"
          aria-hidden="true">&#9996;&#65039;</span>Scissors <kbd>S</kbd></button>
    </div>

    <section class="history" aria-label="Recent rounds">
      <h2>Last rounds</h2>
      <ol id="history" class="chips">
        <li class="empty">No rounds yet</li>
      </ol>
    </section>

    <button class="reset" id="reset" type="button">Reset score</button>
  </main>

  <footer class="foot">
    <p>Built by Mantu Yadav &middot; Veda Technology Internship</p>
  </footer>
  <script src="script.js"></script>
</body>

</html>
