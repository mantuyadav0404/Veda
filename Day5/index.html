<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Live temperature converter for Celsius, Fahrenheit and Kelvin.">
  <title>Temperature Converter | Mantu Yadav</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <header>
      <p class="eyebrow">Veda Technology &middot; Task 5</p>
      <h1>Temperature Converter</h1>
      <p class="intro">Type a value in any field and the other two update instantly.</p>
    </header>

    <form id="converter" novalidate>
      <div class="field">
        <label for="celsius">Celsius <span class="unit">°C</span></label>
        <input id="celsius" name="celsius" type="text" inputmode="decimal" autocomplete="off" placeholder="e.g. 25" aria-describedby="message">
      </div>

      <div class="field">
        <label for="fahrenheit">Fahrenheit <span class="unit">°F</span></label>
        <input id="fahrenheit" name="fahrenheit" type="text" inputmode="decimal" autocomplete="off" placeholder="e.g. 77" aria-describedby="message">
      </div>

      <div class="field">
        <label for="kelvin">Kelvin <span class="unit">K</span></label>
        <input id="kelvin" name="kelvin" type="text" inputmode="decimal" autocomplete="off" placeholder="e.g. 298.15" aria-describedby="message">
      </div>

      <p id="message" class="message" role="status" aria-live="polite"></p>

      <button id="clear" class="clear" type="button">Clear all</button>
    </form>

    <section class="formulas" aria-labelledby="formulas-h">
      <h2 id="formulas-h">Formulas used</h2>
      <ul>
        <li>°F = (°C × 9/5) + 32</li>
        <li>K = °C + 273.15</li>
        <li>°C = (°F − 32) × 5/9</li>
        <li>K = (°F − 32) × 5/9 + 273.15</li>
      </ul>
    </section>
  </main>

  <footer class="foot"><p>Built by Mantu Yadav &middot; Veda Technology Internship</p></footer>

  <script src="script.js"></script>
</body>
</html>
